b_about:["منصة تحريرية ودليل مهني متخصص في طب الجلدية والطب التجميلي، تجمع الأخبار والمقالات والمقابلات والفعاليات وملفات الأطباء في مكان واحد. هذه نسخة تجريبية لعرض التصميم.","Une publication éditoriale et un annuaire professionnel consacrés à la dermatologie et à la médecine esthétique : actualités, articles, entretiens, événements et profils réunis au même endroit. Ceci est une démo de design.","Ein redaktionelles Magazin und Berufsverzeichnis für Dermatologie und ästhetische Medizin: Nachrichten, Artikel, Interviews, Veranstaltungen und Arztprofile an einem Ort. Dies ist eine Design-Demo.","An editorial publication and professional directory for dermatology and aesthetic medicine, bringing news, articles, interviews, events and physician profiles together. This is a design demo."],
b_editorial:["تُنسب الادعاءات الطبية إلى مصادرها، وتُعرض تواريخ النشر والتحديث، ويُوسم المحتوى الممول بوضوح. للتصحيحات استخدم صفحة الاتصال.","Les affirmations médicales sont attribuées à leurs sources, les dates de publication et de mise à jour sont affichées et les contenus sponsorisés clairement signalés. Pour une correction, utilisez la page Contact.","Medizinische Aussagen werden Quellen zugeordnet, Veröffentlichungs- und Aktualisierungsdatum angezeigt und gesponserte Inhalte klar gekennzeichnet. Korrekturen bitte über die Kontaktseite melden.","Medical claims are attributed to their sources, publication and update dates are shown, and sponsored content is clearly labelled. To request a correction, use the contact page."],
b_disclaimer:["المحتوى تعليمي عام ولا يغني عن استشارة طبيب مختص. لا تتخذ قرارًا علاجيًا اعتمادًا على هذه الصفحات وحدها.","Le contenu est éducatif et général ; il ne remplace pas l’avis d’un médecin. Ne prenez aucune décision thérapeutique sur la seule base de ces pages.","Der Inhalt ist allgemein und lehrreich und ersetzt keine ärztliche Beratung. Treffen Sie keine Behandlungsentscheidung allein auf Basis dieser Seiten.","The content is general and educational and does not replace advice from a qualified physician. Do not make treatment decisions based on these pages alone."],
b_ads:["كل محتوى ممول أو إعلان يُوسم بوضوح ولا يختلط بالتوصيات التحريرية. الدفع لا يمنح شارة توثيق ولا اختيارًا تحريريًا.","Tout contenu sponsorisé ou publicitaire est clairement signalé et distinct des recommandations éditoriales. Un paiement n’octroie ni badge de vérification ni sélection éditoriale.","Gesponserte Inhalte und Anzeigen sind klar gekennzeichnet und von redaktionellen Empfehlungen getrennt. Bezahlung verschafft weder Verifizierungsabzeichen noch redaktionelle Auswahl.","All sponsored content and advertising is clearly labelled and kept separate from editorial recommendations. Payment grants neither a verification badge nor editorial selection."],
b_privacy:["نجمع أقل قدر ضروري من البيانات، كالبريد الإلكتروني عند الاشتراك، ولا ننشر مستندات خاصة. هذه النسخة التجريبية لا تحفظ أي بيانات.","Nous ne collectons que le strict nécessaire, comme l’e-mail lors de l’inscription, et ne publions aucun document privé. Cette démo n’enregistre aucune donnée.","Wir erheben nur das Nötigste, etwa die E-Mail bei der Anmeldung, und veröffentlichen keine privaten Dokumente. Diese Demo speichert keine Daten.","We collect only what is necessary, such as your email when subscribing, and never publish private documents. This demo does not store any data."],
b_terms:["باستخدامك الموقع توافق على استخدام محتواه لأغراض مهنية وتعليمية فقط. تُحدَّد الشروط النهائية بعد مراجعة قانونية.","En utilisant ce site, vous acceptez d’en utiliser le contenu à des fins professionnelles et éducatives uniquement. Les conditions définitives seront fixées après examen juridique.","Mit der Nutzung der Seite stimmen Sie zu, den Inhalt nur beruflich und zu Bildungszwecken zu verwenden. Die endgültigen Bedingungen folgen nach rechtlicher Prüfung.","By using this site you agree to use its content for professional and educational purposes only. Final terms will be set after legal review."],
b_contact:["للاستفسارات والتصحيحات التحريرية وطلبات الشراكة.","Pour vos questions, corrections éditoriales et demandes de partenariat.","Für Fragen, redaktionelle Korrekturen und Partnerschaftsanfragen.","For enquiries, editorial corrections and partnership requests."],
b_submit:["أرسل بياناتك المهنية للمراجعة. لا يُنشر أي ملف قبل التحقق من المؤهلات، والنشر لا يعني التوثيق.","Envoyez vos informations professionnelles pour examen. Aucun profil n’est publié avant vérification des diplômes, et la publication n’équivaut pas à une vérification.","Senden Sie Ihre beruflichen Angaben zur Prüfung. Kein Profil wird vor der Qualifikationsprüfung veröffentlicht; Veröffentlichung bedeutet keine Verifizierung.","Send your professional details for review. No profile is published before credentials are checked, and publication does not mean verification."],
b_unsub:["أدخل بريدك الإلكتروني لإلغاء الاشتراك في النشرة.","Saisissez votre e-mail pour vous désabonner de la newsletter.","Geben Sie Ihre E-Mail ein, um den Newsletter abzubestellen.","Enter your email to unsubscribe from the newsletter."]});

var ART={"slug": "ellacor-micro-coring", "d": ["25 أكتوبر 2026", "25 octobre 2026", "25. Oktober 2026", "25 October 2026"], "dl": ["الرياض – التقرير الطبي", "Riyad – Rapport médical", "Riad – Medizinischer Bericht", "Riyadh – Medical Report"], "t": ["ثورة في عالم التجميل: تقنية «إيلاكور» تعيد تعريف شد الوجه بدون جراحة أو ندبات", "Révolution esthétique : la technologie Ellacor redéfinit le lifting du visage sans chirurgie ni cicatrices", "Revolution in der Ästhetik: Ellacor-Technologie definiert das Gesichtsstraffen ohne Operation und Narben neu", "A revolution in aesthetics: Ellacor technology redefines face tightening without surgery or scars"], "s": ["تقنية «إيلاكور» (Micro-Coring) تزيل مقاطع مجهرية من الجلد بإبر مفرغة لتحفيز الشد وإنتاج الكولاجين دون تدخل جراحي.", "Selon le rapport, la technologie Ellacor® (micro-coring) retire de minuscules sections de peau à l’aide de micro-aiguilles creuses, ce qui favorise le raffermissement de la peau et la production de collagène, sans anesthésie générale ni points de suture.", "Laut dem Bericht entfernt die Ellacor®-Technologie (Micro-Coring) mit hohlen Mikronadeln winzige Hautabschnitte, was die Haut strafft und die Kollagenbildung anregt – ohne Vollnarkose und ohne Nähte.", "According to the report, Ellacor® (micro-coring) uses hollow micro-needles to remove tiny sections of skin, prompting tightening and new collagen production, without general anesthesia or surgical stitches."], "b": "<p>في ظل التطور المتسارع الذي يشهده طب الجلدية والعلاج التجميلي، بات الركض وراء الشباب الدائم أكثر أماناً وفاعلية من أي وقت مضى. فلم تعد خيارات تجديد الشباب محصورة بين طاولات الجراحة المعقدة وبين الحقن التجميلية التقليدية التي قد تمنح حجماً إضافياً غير مرغوب فيه. اليوم، يبرز اتجاه عالمي جديد يُعرف بـ «التجميل التجديدي» (Regenerative Aesthetics)، والذي يعتمد على تحفيز الأنسجة الذاتية للجسم لإعادة بناء نفسها.</p><p>وفي هذا السياق، أثارت تقنية «إيلاكور» (Ellacor® Micro-Coring) اهتماماً واسعاً في الأوساط الطبية والأكاديمية، كأول جيل جديد من الأجهزة المعتمدة التي تُحدث ثورة في معالجة ترهلات البشرة والتجاعيد المتوسطة إلى الشديدة بدون تدخل جراحي.</p><h3>كيف تعمل التقنية الجديدة؟</h3><p>على عكس تقنيات الليزر التقليدية التي تعتمد على الحرارة، أو التقشير الكيميائي، تعمل تقنية \"إيلاكور\" عبر آلية مبتكرة تُعرف بـ Micro-Coring؛ حيث تستخدم إبراً مفرغة دقيقة جداً لإزالة مئات المقاطع المجهرية الدقيقة من الجلد على مستوى ميكروسكوبي بدون ترك أي ندبات مرئية.</p><p>وأوضح خبراء في طب الجلدية أن إزالة هذه النسبة الضئيلة من الجلد تفرض على البشرة الاستجابة الفورية لتقليص المساحة المتبقية، مما يؤدي إلى شد طبيعي وملحوظ في الجلد، إلى جانب تحفيز الخياطة الذاتية وإنتاج ألياف الكولاجين والإيلاستين الجديدة بكثافة عالية.</p><h3>نتائج جراحية بفترة تعافٍ قياسية</h3><p>تتميز هذه التقنية بتقديم نتائج قريبة من الشد الجراحي في منطقة أسفل الوجه والفكين، ولكن دون الحاجة إلى التخدير العام أو الغرز الجراحية. كما تسهم في تقليل فترة التعافي بشكل كبير مقارنة بالعمليات التقليدية، حيث يمكن للمريض العودة لممارسة حياته الطبيعية خلال أيام قليلة.</p><p>ويرى أطباء الجلد أن ظهور هذه الأجهزة، إلى جانب التوسع في استخدام المحفزات الحيوية (Biostimulating Injectables)، يمثل تحولاً جذرياً نحو التجميل الوقائي الذي يحافظ على ملامح الوجه الطبيعية ويؤخر علامات تقدم السن دون تغيير في تعابير الوجه.</p><div class=\"src\"><strong>المصدر:</strong><ul><li>هيئة الغذاء والدواء الأمريكية (FDA): اعتماد جهاز Ellacor® لمايكروكورينج الجلد.</li><li>الدورية الطبية: Dermatology Times Journal - Advances in Micro-Coring Technologies and Regenerative Aesthetics.</li><li>الموقع الرسمي للمعلومات الطبية: <a href=\"https://www.dermatologytimes.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Dermatology Times</a></li></ul></div>"};
